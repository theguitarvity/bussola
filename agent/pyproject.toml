[project]
name = "bussola-agent"
version = "0.1.0"
description = "Agente Bússola (ADK); no ciclo 000: agente hello e pontos de extensão"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.10,<3",
    "google-genai>=2,<3",
    "google-auth>=2.58,<3",
    "mcp>=2.2,<3",
    "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "bq: exige BigQuery real (fora do `make test` padrão; use `make test-bq`)",
]
