[project]
name = "bussola-mcp"
version = "0.1.0"
description = "MCP server da Bússola (no ciclo 000: mock sobre fixtures)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=4,<5",
    "pydantic>=2.13,<3",
    "google-cloud-bigquery>=3.45,<4",
    "numpy>=2.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "bq: exige BigQuery real (fora do `make test` padrão; use `make test-bq`)",
]
